name: Deterministic Verification & CycloneDX SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run --extra dev ruff check src tests

      - name: Mypy strict typecheck
        run: uv run --extra dev mypy src tests --strict

      - name: Pytest unit & property invariants
        run: uv run --extra dev pytest -v -m "not integration"

      - name: Generate CycloneDX SBOM
        run: uv run --with cyclonedx-bom cyclonedx-py environment -o sbom.cdx.json

      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json
          retention-days: 30
